name: Build Tizen Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            default-jre \
            xvfb

      # ==================================================
      # Download Tizen 10 Web CLI
      # ==================================================

      - name: Download Tizen Web CLI
        run: |
          wget --progress=dot:giga \
            -O "$RUNNER_TEMP/tizen-web-cli.bin" \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin"

          chmod +x "$RUNNER_TEMP/tizen-web-cli.bin"

          ls -lh "$RUNNER_TEMP/tizen-web-cli.bin"

      # ==================================================
      # Install Tizen Web CLI
      # ==================================================

      - name: Test Tizen installer
        run: |
          "$RUNNER_TEMP/tizen-web-cli.bin" --help || true

          "$RUNNER_TEMP/tizen-web-cli.bin" \
            --accept-license \
            --no-java-check \
            --no-path-check \
            --install-dir "$HOME/tizen-studio" \
            || true

          echo "===== HOME ====="
          find "$HOME" -maxdepth 4 -type f -name "tizen" -print

          echo "===== TIZEN-STUDIO ====="
          find "$HOME/tizen-studio" -maxdepth 6 -print 2>/dev/null | head -500

      # ==================================================
      # Locate Tizen CLI
      # ==================================================

      - name: Locate Tizen CLI
        run: |
          echo "Searching for Tizen CLI..."

          find "$HOME/tizen-studio" \
            -type f \
            \( -name "tizen" -o -name "tizen.sh" \) \
            -print

      # ==================================================
      # Configure PATH
      # ==================================================

      - name: Configure Tizen CLI
        run: |
          TIZEN_BIN="$(
            find "$HOME/tizen-studio" \
              -type f \
              -name "tizen" \
              -print -quit
          )"

          if [ -z "$TIZEN_BIN" ]; then
            echo "ERROR: Tizen executable not found."
            echo
            echo "Installed directory:"
            find "$HOME/tizen-studio" -maxdepth 5 -print
            exit 1
          fi

          echo "Found:"
          echo "$TIZEN_BIN"

          TIZEN_DIR="$(dirname "$TIZEN_BIN")"

          echo "$TIZEN_DIR" >> "$GITHUB_PATH"

      # ==================================================
      # Verify
      # ==================================================

      - name: Verify Tizen
        run: |
          which tizen
          tizen version

      # ==================================================
      # Build Web application
      # ==================================================

      - name: Build Web application
        run: |
          tizen build-web \
            -- .

      # ==================================================
      # Package WGT
      # ==================================================

      - name: Package WGT
        run: |
          tizen package \
            -t wgt \
            -- .buildResult

      # ==================================================
      # Show result
      # ==================================================

      - name: Show generated files
        run: |
          echo "Generated files:"
          find . -type f \( -name "*.wgt" -o -name "*.wgt.sign" \) -print

      # ==================================================
      # Upload WGT
      # ==================================================

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: |
            .buildResult/*.wgt
            *.wgt
          if-no-files-found: error
