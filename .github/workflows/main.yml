name: Build Tizen Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================
      # Checkout
      # ============================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # Dependencies
      # ============================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            default-jre


      # ============================================
      # Download Tizen 10 Web CLI
      # ============================================

      - name: Download Tizen Web CLI
        run: |
          wget --progress=dot:giga \
            -O "$RUNNER_TEMP/tizen-web-cli.bin" \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin"

          chmod +x "$RUNNER_TEMP/tizen-web-cli.bin"

          ls -lh "$RUNNER_TEMP/tizen-web-cli.bin"


      # ============================================
      # Install Tizen Web CLI
      # ============================================

      - name: Install Tizen Web CLI
        run: |
          rm -rf "$HOME/tizen-studio"
          rm -rf "$HOME/tizen-studio-data"

          mkdir -p "$HOME/tizen-studio"

          printf 'y\n' | "$RUNNER_TEMP/tizen-web-cli.bin" \
            --accept-license \
            --no-java-check \
            --no-path-check \
            --install-dir "$HOME/tizen-studio"


      # ============================================
      # Locate Tizen CLI
      # ============================================

      - name: Locate Tizen CLI
        run: |
          echo "Searching for Tizen CLI..."

          find "$HOME/tizen-studio" \
            -type f \
            -name "tizen" \
            -print

          echo
          echo "Searching for tizen.sh..."

          find "$HOME/tizen-studio" \
            -type f \
            -name "tizen.sh" \
            -print


      # ============================================
      # Configure PATH
      # ============================================

      - name: Configure Tizen PATH
        run: |
          TIZEN_BIN="$(
            find "$HOME/tizen-studio" \
              -type f \
              -name "tizen" \
              -print -quit
          )"

          if [ -z "$TIZEN_BIN" ]; then
            echo "ERROR: Tizen executable was not found."

            echo
            echo "Installation tree:"
            find "$HOME/tizen-studio" \
              -maxdepth 8 \
              -print 2>/dev/null

            exit 1
          fi

          echo "Found Tizen:"
          echo "$TIZEN_BIN"

          TIZEN_DIR="$(dirname "$TIZEN_BIN")"

          echo "Adding to PATH:"
          echo "$TIZEN_DIR"

          echo "$TIZEN_DIR" >> "$GITHUB_PATH"


      # ============================================
      # Verify
      # ============================================

      - name: Verify Tizen CLI
        run: |
          which tizen
          tizen version


      # ============================================
      # Build Web App
      # ============================================

      - name: Build Web App
        run: |
          tizen build-web \
            -- .


      # ============================================
      # Package WGT
      # ============================================

      - name: Package WGT
        run: |
          tizen package \
            -t wgt \
            -- .buildResult


      # ============================================
      # Find WGT
      # ============================================

      - name: Find WGT
        run: |
          echo "Generated WGT files:"

          find . \
            -type f \
            -name "*.wgt" \
            -print


      # ============================================
      # Upload WGT
      # ============================================

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: |
            .buildResult/*.wgt
            *.wgt
          if-no-files-found: error
