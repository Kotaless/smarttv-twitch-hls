name: Build Tizen WGT

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  APP_DIR: app
  TIZEN_STUDIO_VERSION: "5.6"
  TIZEN_HOME: ${{ github.workspace }}/../tizen-studio
  TIZEN_DATA: ${{ github.workspace }}/../tizen-studio-data

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip libxml2-utils

      - name: Cache Tizen Studio CLI
        id: cache-tizen
        uses: actions/cache@v4
        with:
          path: ${{ env.TIZEN_HOME }}
          key: tizen-studio-cli-${{ env.TIZEN_STUDIO_VERSION }}

      - name: Install Tizen Studio CLI
        if: steps.cache-tizen.outputs.cache-hit != 'true'
        run: |
          VER="${TIZEN_STUDIO_VERSION}"
          URL="https://download.tizen.org/sdk/Installer/tizen-studio_${VER}/web-cli_Tizen_Studio_${VER}_ubuntu-64.bin"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/tizen-installer.bin"
          chmod +x "$RUNNER_TEMP/tizen-installer.bin"
          "$RUNNER_TEMP/tizen-installer.bin" --accept-license "$TIZEN_HOME"

      - name: Add Tizen CLI to PATH
        run: |
          echo "$TIZEN_HOME/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$TIZEN_HOME/tools" >> "$GITHUB_PATH"

      - name: Create throwaway signing profile
        run: |
          mkdir -p "$TIZEN_DATA/keystore" "$TIZEN_DATA/profile"
          PASS="ci-password-123"
          tizen certificate \
            -a CI -p "$PASS" -c US -ct NA -o CI -n CI -e ci@example.com \
            -f author -- "$TIZEN_DATA/keystore"

          DIST="$TIZEN_HOME/tools/certificate-generator/certificates/distributor"
          ls -la "$TIZEN_DATA/keystore" "$DIST"

          # Write the profile by hand with plaintext passwords (headless-safe)
          cat > "$TIZEN_DATA/profile/profiles.xml" << XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <profiles active="ci-profile" version="3.1">
          <profile name="ci-profile">
          <profileitem ca="" distributor="0" key="$TIZEN_DATA/keystore/author.p12" password="$PASS" rootca=""/>
          <profileitem ca="$DIST/tizen-distributor-ca.cer" distributor="1" key="$DIST/tizen-distributor-signer.p12" password="tizenpkcs12passfordsigner" rootca=""/>
          <profileitem ca="" distributor="2" key="" password="" rootca=""/>
          </profile>
          </profiles>
          XML
          sed -i 's/^ *//' "$TIZEN_DATA/profile/profiles.xml"
          tizen security-profiles list

      - name: Verify config.xml exists
        run: test -f "$APP_DIR/config.xml" || (echo "No config.xml in $APP_DIR" && ls -la && exit 1)

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: tizen build-web -- .

      - name: Package WGT
        working-directory: ${{ env.APP_DIR }}
        run: tizen package -t wgt -s ci-profile -- .buildResult

      - name: Dump Tizen CLI log on failure
        if: failure()
        run: cat "$TIZEN_DATA/cli/logs/cli.log" || true

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp "$APP_DIR"/.buildResult/*.wgt dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist/*.wgt
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wgt
