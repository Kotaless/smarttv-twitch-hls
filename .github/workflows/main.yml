name: Build Tizen App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip default-jre

      - name: Download Tizen Studio Web CLI
        run: |
          wget -O tizen-cli.bin \
            "https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin"

          chmod +x tizen-cli.bin

      - name: Install Tizen Studio Web CLI
        run: |
          ./tizen-cli.bin \
            --accept-license \
            --no-java-check \
            --no-path-check \
            --install-dir "$HOME/tizen-studio"

      - name: Show installation
        run: |
          find "$HOME/tizen-studio" -maxdepth 4 -type f \
            \( -name "tizen" -o -name "package-manager" \) \
            -print

      - name: Build Tizen WGT
        run: |
          "$HOME/tizen-studio/tools/ide/bin/tizen" package \
            -t wgt \
            -- .

      - name: Find WGT
        run: |
          find . -type f -name "*.wgt" -print

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-app
          path: "**/*.wgt"
