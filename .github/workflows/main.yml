name: Build Tizen Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            default-jre

      # ----------------------------------------
      # Download Tizen 10 Web CLI
      # ----------------------------------------
      - name: Download Tizen Web CLI
        run: |
          wget -q --show-progress \
            -O tizen-web-cli.bin \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin"

          chmod +x tizen-web-cli.bin

          ls -lh tizen-web-cli.bin

      # ----------------------------------------
      # Install Tizen CLI
      # ----------------------------------------
      - name: Install Tizen Web CLI
        run: |
          rm -rf "$HOME/tizen"

          mkdir -p "$HOME/tizen"

          ./tizen-web-cli.bin \
            --accept-license \
            --no-java-check \
            --no-path-check \
            --install-dir "$HOME/tizen"

      # ----------------------------------------
      # Find the actual Tizen executable
      # ----------------------------------------
      - name: Locate Tizen CLI
        run: |
          echo "Searching for tizen executable..."

          find "$HOME/tizen" \
            -type f \
            -name "tizen" \
            -print

      # ----------------------------------------
      # Add Tizen CLI to PATH
      # ----------------------------------------
      - name: Configure PATH
        run: |
          TIZEN_BIN="$(find "$HOME/tizen" -type f -name tizen -print -quit)"

          if [ -z "$TIZEN_BIN" ]; then
            echo "ERROR: tizen executable was not found"
            find "$HOME/tizen" -maxdepth 5 -type f | head -200
            exit 1
          fi

          TIZEN_DIR="$(dirname "$TIZEN_BIN")"

          echo "Tizen executable:"
          echo "$TIZEN_BIN"

          echo "Tizen directory:"
          echo "$TIZEN_DIR"

          echo "$TIZEN_DIR" >> "$GITHUB_PATH"

      # ----------------------------------------
      # Verify CLI
      # ----------------------------------------
      - name: Verify Tizen CLI
        run: |
          which tizen
          tizen version

      # ----------------------------------------
      # Build Web application
      # ----------------------------------------
      - name: Build Web App
        run: |
          tizen build-web -- ./

      # ----------------------------------------
      # Show build result
      # ----------------------------------------
      - name: Show build output
        run: |
          echo "Build output:"
          find . -maxdepth 3 -type f | sort

      # ----------------------------------------
      # Package WGT
      # ----------------------------------------
      - name: Package WGT
        run: |
          tizen package \
            -t wgt \
            -- ./.buildResult

      # ----------------------------------------
      # Find WGT
      # ----------------------------------------
      - name: Find WGT
        run: |
          echo "Generated WGT files:"
          find . -type f -name "*.wgt" -print

      # ----------------------------------------
      # Upload WGT
      # ----------------------------------------
      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: |
            .buildResult/*.wgt
            *.wgt
          if-no-files-found: error
