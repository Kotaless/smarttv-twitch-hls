name: Build Tizen Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================
      # Checkout
      # ============================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================
      # Dependencies
      # ============================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            curl \
            unzip \
            default-jre \
            xvfb


      # ============================================
      # Download Tizen Web CLI 10
      # ============================================

      - name: Download Tizen Web CLI
        run: |
          wget --progress=dot:giga \
            -O "$RUNNER_TEMP/tizen-web-cli.bin" \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin"

          chmod +x "$RUNNER_TEMP/tizen-web-cli.bin"

          ls -lh "$RUNNER_TEMP/tizen-web-cli.bin"


      # ============================================
      # Extract the .bin
      # ============================================

      - name: Extract Tizen installer
        run: |
          rm -rf "$RUNNER_TEMP/tizen-installer"

          mkdir -p "$RUNNER_TEMP/tizen-installer"

          cd "$RUNNER_TEMP/tizen-installer"

          "$RUNNER_TEMP/tizen-web-cli.bin"

          echo "Installer contents:"
          find . -maxdepth 4 -type f -print


      # ============================================
      # Find installer.sh
      # ============================================

      - name: Locate installer.sh
        run: |
          INSTALLER="$(
            find "$RUNNER_TEMP/tizen-installer" \
              -type f \
              -name "installer.sh" \
              -print -quit
          )"

          if [ -z "$INSTALLER" ]; then
            echo "ERROR: installer.sh not found"

            find "$RUNNER_TEMP/tizen-installer" \
              -maxdepth 6 \
              -print

            exit 1
          fi

          echo "Installer:"
          echo "$INSTALLER"

          echo "TIZEN_INSTALLER=$INSTALLER" >> "$GITHUB_ENV"


      # ============================================
      # Install Tizen Web CLI
      # ============================================

      - name: Install Tizen Web CLI
        run: |
          chmod +x "$TIZEN_INSTALLER"

          mkdir -p "$HOME/tizen-studio"

          "$TIZEN_INSTALLER" \
            --accept-license \
            --no-java-check \
            --no-path-check \
            --install-dir "$HOME/tizen-studio"


      # ============================================
      # Find installed Tizen CLI
      # ============================================

      - name: Locate Tizen CLI
        run: |
          echo "Searching for tizen..."

          find "$HOME/tizen-studio" \
            -type f \
            -name "tizen" \
            -print

          echo
          echo "Searching entire HOME..."

          find "$HOME" \
            -type f \
            -name "tizen" \
            -print 2>/dev/null || true


      # ============================================
      # Configure PATH
      # ============================================

      - name: Configure Tizen PATH
        run: |
          TIZEN_BIN="$(
            find "$HOME/tizen-studio" \
              -type f \
              -name "tizen" \
              -print -quit
          )"

          if [ -z "$TIZEN_BIN" ]; then
            echo "ERROR: Tizen executable was not found."

            echo
            echo "Tizen installation tree:"
            find "$HOME/tizen-studio" \
              -maxdepth 8 \
              -print 2>/dev/null

            exit 1
          fi

          echo "Tizen executable:"
          echo "$TIZEN_BIN"

          TIZEN_DIR="$(dirname "$TIZEN_BIN")"

          echo "Tizen directory:"
          echo "$TIZEN_DIR"

          echo "$TIZEN_DIR" >> "$GITHUB_PATH"


      # ============================================
      # Verify
      # ============================================

      - name: Verify Tizen CLI
        run: |
          which tizen

          tizen version


      # ============================================
      # Build Web application
      # ============================================

      - name: Build Web App
        run: |
          tizen build-web \
            -- .


      # ============================================
      # Package WGT
      # ============================================

      - name: Package WGT
        run: |
          tizen package \
            -t wgt \
            -- .buildResult


      # ============================================
      # Show generated WGT
      # ============================================

      - name: Find WGT
        run: |
          echo "Generated WGT files:"

          find . \
            -type f \
            -name "*.wgt" \
            -print


      # ============================================
      # Upload artifact
      # ============================================

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: |
            .buildResult/*.wgt
            *.wgt
          if-no-files-found: error
