name: Build Tizen Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            unzip \
            default-jre \
            libwebkit2gtk-4.0-37

      # ----------------------------------------
      # Download Tizen Web CLI
      # ----------------------------------------
      - name: Download Tizen Web CLI
        run: |
          wget -q --show-progress \
            -O tizen-cli.zip \
            "https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.zip"

          ls -lh tizen-cli.zip

      # ----------------------------------------
      # Extract
      # ----------------------------------------
      - name: Extract Tizen CLI
        run: |
          mkdir -p "$HOME/tizen"

          unzip -q tizen-cli.zip -d "$HOME/tizen"

          echo "Installed files:"
          find "$HOME/tizen" -maxdepth 5 -type f | head -200

      # ----------------------------------------
      # Find CLI
      # ----------------------------------------
      - name: Locate Tizen CLI
        run: |
          echo "Searching for tizen..."

          find "$HOME/tizen" \
            -type f \
            -name "tizen" \
            -print

      # ----------------------------------------
      # Configure PATH
      # ----------------------------------------
      - name: Configure Tizen PATH
        run: |
          TIZEN_BIN="$(find "$HOME/tizen" \
            -type f \
            -name tizen \
            -print -quit)"

          if [ -z "$TIZEN_BIN" ]; then
            echo "ERROR: tizen executable was not found"
            echo
            echo "Directory tree:"
            find "$HOME/tizen" -maxdepth 6 -print
            exit 1
          fi

          TIZEN_DIR="$(dirname "$TIZEN_BIN")"

          echo "Tizen CLI: $TIZEN_BIN"
          echo "Tizen CLI directory: $TIZEN_DIR"

          echo "$TIZEN_DIR" >> "$GITHUB_PATH"

      # ----------------------------------------
      # Verify
      # ----------------------------------------
      - name: Verify Tizen CLI
        run: |
          which tizen
          tizen version

      # ----------------------------------------
      # Build
      # ----------------------------------------
      - name: Build Web App
        run: |
          tizen build-web -- ./

      # ----------------------------------------
      # Package
      # ----------------------------------------
      - name: Package WGT
        run: |
          tizen package \
            -t wgt \
            -- ./.buildResult

      # ----------------------------------------
      # Find package
      # ----------------------------------------
      - name: Find WGT
        run: |
          find . -type f -name "*.wgt" -print

      # ----------------------------------------
      # Upload
      # ----------------------------------------
      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: |
            .buildResult/*.wgt
            *.wgt
          if-no-files-found: error
