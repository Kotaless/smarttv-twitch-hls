name: Build Tizen WGT

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Folder containing config.xml (use "." if it's the repo root)
  APP_DIR: "."
  TIZEN_STUDIO_VERSION: "5.6"
  TIZEN_HOME: ${{ github.workspace }}/../tizen-studio
  TIZEN_DATA: ${{ github.workspace }}/../tizen-studio-data

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Optional: build your web assets first (remove if you have no build step)
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - run: npm ci && npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip libxml2-utils

      - name: Cache Tizen Studio CLI
        id: cache-tizen
        uses: actions/cache@v4
        with:
          path: ${{ env.TIZEN_HOME }}
          key: tizen-studio-cli-${{ env.TIZEN_STUDIO_VERSION }}

      - name: Install Tizen Studio CLI
        if: steps.cache-tizen.outputs.cache-hit != 'true'
        run: |
          VER="${TIZEN_STUDIO_VERSION}"
          URL="https://download.tizen.org/sdk/Installer/tizen-studio_${VER}/web-cli_Tizen_Studio_${VER}_ubuntu-64.bin"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/tizen-installer.bin"
          chmod +x "$RUNNER_TEMP/tizen-installer.bin"
          "$RUNNER_TEMP/tizen-installer.bin" --accept-license "$TIZEN_HOME"

      - name: Add Tizen CLI to PATH
        run: |
          echo "$TIZEN_HOME/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$TIZEN_HOME/tools" >> "$GITHUB_PATH"

      # Uses your own author certificate if secrets are set,
      # otherwise generates a throwaway one (fine for testing / sideloading
      # on a TV in developer mode with a matching distributor cert).
      - name: Create signing profile
        env:
          AUTHOR_P12_BASE64: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
        run: |
          mkdir -p "$TIZEN_DATA/keystore"
          if [ -n "$AUTHOR_P12_BASE64" ]; then
            echo "$AUTHOR_P12_BASE64" | base64 -d > "$TIZEN_DATA/keystore/author.p12"
            PASS="$AUTHOR_PASSWORD"
          else
            PASS="ci-password-123"
            tizen certificate \
              -a CI -p "$PASS" -c US -ct NA -o CI -n CI -e ci@example.com \
              -f author -- "$TIZEN_DATA/keystore"
          fi
          tizen security-profiles add \
            -n ci-profile \
            -a "$TIZEN_DATA/keystore/author.p12" \
            -p "$PASS"
          # Make sure the password is stored in plain text for headless signing
          tizen security-profiles list

      - name: Build web app
        working-directory: ${{ env.APP_DIR }}
        run: tizen build-web -- .

      - name: Package WGT
        working-directory: ${{ env.APP_DIR }}
        run: tizen package -t wgt -s ci-profile -- .buildResult

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp "$APP_DIR"/.buildResult/*.wgt dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tizen-wgt
          path: dist/*.wgt
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wgt
